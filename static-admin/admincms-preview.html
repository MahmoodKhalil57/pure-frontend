<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>

  <!--
    Live preview for the adminCms panel.

    The same idea as the Sveltia preview beside it: rather than approximate the
    page with a field-by-field summary, load the real page and pour draft
    content through the site's own renderer. A preview that uses a second
    renderer is a preview of the second renderer.

    This is a plain page rather than a CMS plugin, so the panel can host it in
    an iframe and post drafts to it. It reads nothing and writes nothing — it
    only paints what it is given.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/page.css">
  <style>
    /* The panel sizes the frame; the page must not add its own scroll chrome. */
    html, body { margin: 0; }
    .preview-status {
      position: fixed; inset-block-start: 0; inset-inline: 0;
      padding: 0.5rem 0.75rem; font: 500 12px/1.4 system-ui, sans-serif;
      background: #111; color: #fff; z-index: 9999;
    }
    .preview-status[hidden] { display: none; }
  </style>
</head>
<body>
  <p class="preview-status" id="status">Loading the page…</p>
  <div id="surface"></div>

  <script src="../assets/js/render.js"></script>
  <script>
  (function () {
    "use strict";

    var SITE_BASE = new URL("..", location.href);
    var surface = document.getElementById("surface");
    var status = document.getElementById("status");

    // Last-committed content, so fields the operator is not editing still show
    // their real values instead of blanks.
    var committed = {};
    var ready = false;
    var pending = null;

    function say(message) {
      if (!message) { status.hidden = true; return; }
      status.hidden = false;
      status.textContent = message;
    }

    function fetchJson(name) {
      return fetch(new URL("content/" + name, SITE_BASE).href, { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    }

    function stripBody(html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      doc.body.querySelectorAll("script").forEach(function (n) { n.remove(); });
      return doc.body.innerHTML;
    }

    /* A draft replaces one file's content; everything else stays committed. */
    function merge(draft) {
      var content = JSON.parse(JSON.stringify(committed));
      if (!draft || !draft.collection) return content;

      if (draft.collection === "settings" || draft.collection === "content") {
        // `files` collections map an entry onto a content file of that name.
        content[draft.id] = Object.assign({}, content[draft.id], draft.data);
      } else if (draft.collection === "symbols") {
        content.symbolEntries = content.symbolEntries || {};
        content.symbolEntries[draft.id] = draft.data;
      } else if (draft.collection === "pages") {
        content.pages = content.pages || {};
        content.pages[draft.id] = draft.data;
      }
      return content;
    }

    function paint(draft) {
      if (!ready) { pending = draft; return; }
      if (!window.PureRender) { say("Renderer missing."); return; }

      surface.innerHTML = bodyHtml;
      try {
        window.PureRender.bindAll(surface, merge(draft), {
          asset: function (path) {
            return path ? new URL(path, SITE_BASE).href : path;
          },
        });
        say(null);
      } catch (error) {
        say("Could not render: " + error.message);
      }
    }

    var bodyHtml = "";

    Promise.all([
      fetch(new URL("index.html", SITE_BASE).href, { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .catch(function () { return ""; }),
      fetchJson("site.json"),
      fetchJson("pages.json"),
      fetchJson("symbols.json"),
    ]).then(function (parts) {
      bodyHtml = stripBody(parts[0]);
      committed.site = parts[1] || {};
      committed.pages = parts[2] || {};
      committed.symbolEntries = {};
      (((parts[3] || {}).symbols) || []).forEach(function (entry) {
        if (entry && entry.id) committed.symbolEntries[entry.id] = entry;
      });

      // Content files the symbols point at, so lists render with real items.
      var roots = {};
      Object.keys(committed.symbolEntries).forEach(function (id) {
        var source = committed.symbolEntries[id].source;
        if (source) roots[String(source).split(".")[0]] = true;
      });

      var names = Object.keys(roots).filter(function (n) {
        return n !== "site" && n !== "pages";
      });

      return Promise.all(names.map(function (n) { return fetchJson(n + ".json"); }))
        .then(function (files) {
          names.forEach(function (name, i) { committed[name] = files[i] || {}; });
        });
    }).then(function () {
      ready = true;
      paint(pending);
      // Tell the panel we are listening, in case it posted before we loaded.
      if (window.parent !== window) {
        window.parent.postMessage({ type: "admincms:preview-ready" }, "*");
      }
    }).catch(function (error) {
      say("Could not load the page: " + error.message);
    });

    window.addEventListener("message", function (event) {
      var data = event.data;
      if (!data || data.type !== "admincms:preview") return;
      paint(data);
    });
  })();
  </script>
</body>
</html>
