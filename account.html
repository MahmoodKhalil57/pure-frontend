<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your account — Qalam &amp; Ahar</title>
    <meta name="description" content="Create an account or sign in." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400..700&amp;display=swap"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <!-- Styles authored in the visual builder land here; styles.css stays hand-written. -->
    <link rel="stylesheet" href="assets/css/page.css" />
  </head>

  <body>
    <a href="#main" class="skip">Skip to content</a>
    <aside aria-label="Announcement" data-when="site.announcement" class="banner">
      <p data-text="site.announcement"></p>
    </aside>

    <header class="masthead">
      <a href="./" class="brand">
        <span lang="ar" dir="rtl" class="brand__ar">قلم و آهار</span>
        <span class="brand__latin">Qalam &amp; Ahar</span>
      </a>
      <nav aria-label="Sections" data-list="pages.pages" class="masthead__nav">
        <a href="./">Home</a>
      </nav>
    </header>

    <main id="main">
      <!--
        A symbol, the same way the sign-up form is one. The entry in
        content/symbols says what it carries (binding: account) and main.js
        reads that; this markup is the drawing, which the builder owns.
      -->
      <section data-symbol="account-forms" class="account">
        <header class="section-head">
          <p class="eyebrow">Your account</p>
          <h2 class="section-head__title">Sign in</h2>
        </header>

        <p class="account__status" data-account-status hidden></p>

        <div class="account__card" data-account-signed-in hidden>
          <p>Signed in as <strong data-account-name></strong>.</p>
          <p class="account__note">
            A new account can reach what it is given and nothing more.
          </p>
          <button type="button" class="btn btn--ghost" data-account-sign-out>
            Sign out
          </button>
        </div>

        <div class="account__pair" data-account-signed-out>
          <div class="account__card">
            <p class="account__title">Create an account</p>
            <form data-account="sign-up" novalidate>
              <div class="account__field">
                <label for="account-name">Your name</label>
                <input
                  class="notify__input"
                  id="account-name"
                  name="name"
                  autocomplete="name"
                />
              </div>
              <div class="account__field">
                <label for="account-email">Email</label>
                <input
                  class="notify__input"
                  id="account-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                />
              </div>
              <div class="account__field">
                <label for="account-password">Password</label>
                <input
                  class="notify__input"
                  id="account-password"
                  name="password"
                  type="password"
                  required
                  minlength="8"
                  autocomplete="new-password"
                />
              </div>
              <button type="submit" class="btn btn--solid">
                Create my account
              </button>
              <p class="account__status" data-account-note hidden></p>
            </form>
          </div>

          <div class="account__card">
            <p class="account__title">Already have one</p>
            <form data-account="sign-in" novalidate>
              <div class="account__field">
                <label for="signin-email">Email</label>
                <input
                  class="notify__input"
                  id="signin-email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                />
              </div>
              <div class="account__field">
                <label for="signin-password">Password</label>
                <input
                  class="notify__input"
                  id="signin-password"
                  name="password"
                  type="password"
                  required
                  autocomplete="current-password"
                />
              </div>
              <button type="submit" class="btn btn--solid">Sign in</button>
              <p class="account__status" data-account-note hidden></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="colophon">
      <p lang="ar" dir="rtl" class="colophon__ar">قلم و آهار</p>
      <ul data-list="site.contact.links" class="colophon__links"></ul>
    </footer>

    <script src="assets/js/render.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
